# Prometheus of the external monitoring (#15). The targets come from targets/*.yml
# (generated by infra/monitoring/configure.sh from the public hosts), with the `component` label
# (portal, ingest-web, ingest-api) that appears in the alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Each target is tested by the blackbox exporter: Prometheus requests
  # /probe?target=<url> and gets probe_success, time and TLS validity.
  - job_name: endpoints
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
    relabel_configs:
      # A target can ask for another blackbox module through the `module` label
      # (API ingestion uses otlp_401); without the label http_2xx applies.
      - source_labels: [module]
        regex: (.+)
        target_label: __param_module
      - regex: module
        action: labeldrop
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
