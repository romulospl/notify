# Alerts of the external monitoring (#15). Texts in English, like the UI.
groups:
  - name: stellytics-endpoints
    rules:
      # Portal, web ingestion or API ingestion without a 2xx answer for 1 minute.
      # ingest-web only answers 2xx with Postgres and Umami up.
      - alert: EndpointDown
        expr: probe_success{job="endpoints", component!="stack"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.component }} is down"
          description: "{{ $labels.instance }} has not answered with 2xx for over a minute."

      # The VPS internal check (infra/scripts/stack-check.py, every minute)
      # failed: container stopped or unhealthy (rollup turns unhealthy when the
      # rollup stops), WAL not archived, base backup older than 26 h or
      # disk above the limit. The 5 minutes absorb the recreations of a deploy.
      - alert: StackUnhealthy
        expr: probe_success{job="endpoints", component="stack"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The production stack check is failing"
          description: "Run `journalctl -u stellytics-check -n 20` on the VPS to see which check failed (containers, WAL archiving, base backup or disk)."

      # The Caddy certificate renews by itself ~30 days before; 14 days means
      # that the renewal is failing (DNS, port 80 or Let's Encrypt).
      - alert: TLSCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="endpoints"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate of {{ $labels.component }} expires in less than 14 days"
          description: "{{ $labels.instance }}: the automatic renewal is probably failing."

      # Prometheus could not even request the test from the blackbox (missing
      # module, blackbox not answering at /probe): probe_success disappears instead
      # of going to 0, and EndpointDown would not fire.
      - alert: ProbeFailing
        expr: up{job="endpoints"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.component }} is not being checked"
          description: "The probe request for {{ $labels.instance }} itself fails, so its availability is unknown."

      # Without the blackbox, no target is tested and no EndpointDown fires.
      - alert: ProberDown
        expr: up{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The blackbox prober is down"
          description: "Endpoints are not being checked."

      # Always active: goes to the external heartbeat (if configured). If it
      # stops arriving, it is the monitoring itself that is down.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Monitoring is alive"
