# Unit tests of the rules (#15): promtool test rules alerts.test.yml
# They run in the monitoring test (test/monitoring-test.sh). They stay outside
# prometheus/rules/, which Prometheus loads in full.
rule_files:
  - ../prometheus/rules/alerts.yml

evaluation_interval: 15s

tests:
  # Target down: fires after 1 minute, not before.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="endpoints", instance="https://app.example.org/api/auth/ok", component="portal"}'
        values: "1 1 0x8"
    alert_rule_test:
      - eval_time: 45s
        alertname: EndpointDown
        exp_alerts: []
      - eval_time: 2m
        alertname: EndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: endpoints
              instance: https://app.example.org/api/auth/ok
              component: portal
            exp_annotations:
              summary: "portal is down"
              description: "https://app.example.org/api/auth/ok has not answered with 2xx for over a minute."

  # The stack check does not fire EndpointDown, but StackUnhealthy,
  # after 5 minutes.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="endpoints", instance="https://e.example.org/healthz/stack", component="stack"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: EndpointDown
        exp_alerts: []
      - eval_time: 4m
        alertname: StackUnhealthy
        exp_alerts: []
      - eval_time: 6m
        alertname: StackUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              job: endpoints
              instance: https://e.example.org/healthz/stack
              component: stack
            exp_annotations:
              summary: "The production stack check is failing"
              description: "Run `journalctl -u stellytics-check -n 20` on the VPS to see which check failed (containers, WAL archiving, base backup or disk)."

  # The request to the blackbox fails: no probe_success, but with up=0.
  - interval: 15s
    input_series:
      - series: 'up{job="endpoints", instance="https://e.example.org/healthz", component="ingest-web"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 3m
        alertname: ProbeFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: endpoints
              instance: https://e.example.org/healthz
              component: ingest-web
            exp_annotations:
              summary: "ingest-web is not being checked"
              description: "The probe request for https://e.example.org/healthz itself fails, so its availability is unknown."

  # Certificate with 10 days of validity: alerts after 1 hour.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="endpoints", instance="https://e.example.org/healthz", component="ingest-web"}'
        values: "864000x120"
    alert_rule_test:
      - eval_time: 75m
        alertname: TLSCertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: endpoints
              instance: https://e.example.org/healthz
              component: ingest-web
            exp_annotations:
              summary: "TLS certificate of ingest-web expires in less than 14 days"
              description: "https://e.example.org/healthz: the automatic renewal is probably failing."

  # Certificate with 60 days: nothing.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="endpoints", instance="https://e.example.org/healthz", component="ingest-web"}'
        values: "5184000x120"
    alert_rule_test:
      - eval_time: 2h
        alertname: TLSCertificateExpiringSoon
        exp_alerts: []

  # Blackbox down.
  - interval: 15s
    input_series:
      - series: 'up{job="blackbox", instance="blackbox:9115"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 3m
        alertname: ProberDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: blackbox:9115
            exp_annotations:
              summary: "The blackbox prober is down"
              description: "Endpoints are not being checked."

  # The heartbeat is always active.
  - interval: 15s
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Monitoring is alive"
