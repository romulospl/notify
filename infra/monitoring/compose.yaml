# Monitoramento externo da produção (#15, ADR 0005): roda numa VM separada,
# em outro data center, e testa de fora os endpoints públicos. Se a VM de
# produção cair inteira, este monitor continua de pé para avisar.
#
# Nenhuma porta pública: Prometheus e Alertmanager escutam só no loopback da
# VM; acesse pelo túnel SSH (docs/deploy.md, "Monitoramento"). O Ansible
# (infra/ansible/monitoring.yml) gera prometheus/targets/*.yml e
# alertmanager/alertmanager.yml.
name: stellytics-monitor

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      # Pastas, não arquivos: o Ansible troca os arquivos por renomeação, e um
      # arquivo montado sozinho continuaria apontando para a versão antiga.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # alertmanager.yml e secrets/ (senha do SMTP e URL do sinal de vida),
      # gerados pelo Ansible.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  prometheus-data:
  alertmanager-data:
