# Blackbox exporter modules (#15).
modules:
  # GET that must answer 2xx within 10 s, without following redirects.
  # In production the targets are https://; the certificate must be valid.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
  # API ingestion (ADR 0012): POST without a key to OTLP/HTTP. The 401 comes from the
  # collector, so it proves that Caddy and the collector are up without writing anything.
  otlp_401:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: "{}"
      valid_status_codes: [401]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
