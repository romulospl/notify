# Local environment: PostgreSQL (umami and stellytics databases), Umami v3.4.1, Mailpit, the portal,
# the web ingestion gateway, the API metrics collector and the rollup job.
# Default values are for development only; override them in a .env at the root.

services:
  postgres:
    # Postgres 17.11, pinned by digest.
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      STELLYTICS_DB_PASSWORD: ${STELLYTICS_DB_PASSWORD:-stellytics}
      # Gateway and collector users, with minimal privileges (02-ingest-roles.sh).
      STELLYTICS_INGEST_DB_PASSWORD: ${STELLYTICS_INGEST_DB_PASSWORD:-stellytics_ingest}
      STELLYTICS_COLLECTOR_DB_PASSWORD: ${STELLYTICS_COLLECTOR_DB_PASSWORD:-stellytics_collector}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on the first start (empty volume): creates the umami and stellytics databases
      # and the stellytics_ingest and stellytics_collector users.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during the init scripts the entrypoint's temporary server
      # listens only on the socket, so this passes only after they finish.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  umami:
    # Umami v3.4.1, pinned by tag and digest. Upgrade only by PR (see CLAUDE.md).
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-dev-only-umami-app-secret}
      DISABLE_TELEMETRY: "1"
      # Client IP, already truncated by the gateway.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
    depends_on:
      postgres:
        condition: service_healthy
    # No published port (#62): Umami is reachable only over the internal network, by the
    # portal and the gateway. Publishing /api/send would allow bypassing the anti-bot and
    # the IP truncation. To use the UI or the API on the host during
    # development, include umami-port.yaml (see this folder's README).
    # Session recording and heatmaps stay off: they exist only with
    # recorder_enabled per site, which the portal never turns on, and the /api/record
    # route is not relayed by the gateway (docs/umami.md).
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Receives the portal's emails (confirmation and password reset, #60).
  # Inbox at http://127.0.0.1:8025; SMTP at 127.0.0.1:1025 for
  # `next dev` outside Docker. In production SMTP comes from the IaC (#14).
  mailpit:
    # Mailpit v1.32.0, pinned by tag and digest.
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      # Stage with the development accounts (drizzle-dev).
      target: dev
    image: stellytics-portal:dev
    environment:
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:-stellytics}@postgres:5432/stellytics
      BETTER_AUTH_SECRET: ${PORTAL_AUTH_SECRET:-dev-only-portal-auth-secret-change-me}
      BETTER_AUTH_URL: http://localhost:${PORTAL_PORT:-3000}
      # Applies the Drizzle migrations on startup.
      RUN_MIGRATIONS: "true"
      # Development accounts (apps/portal/drizzle-dev). Never in production.
      SEED_DEV_DATA: "true"
      # Service account in Umami (#58). The key comes from
      # `pnpm --filter @stellytics/portal umami:service-account`; without it the portal
      # starts, but creates no sites and reads no statistics.
      UMAMI_URL: http://umami:3000
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      # Confirmation and password reset emails go to Mailpit.
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: stellytics <no-reply@stellytics.localhost>
      # Sign-up with prior approval (#49, ADR 0007): true leaves new projects
      # pending until an operator approves them at /operator/approvals.
      SIGNUP_APPROVAL: ${SIGNUP_APPROVAL:-false}
      # Public demo: slug of the tenant shown at /demo; empty = sample data.
      DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-}
      # Gateway address in the installation tag shown on each site's page.
      INGEST_URL: http://localhost:${INGEST_WEB_PORT:-3002}
      # Collector OTLP address shown with each service's ingest keys.
      COLLECTOR_URL: http://127.0.0.1:${COLLECTOR_HTTP_PORT:-4318}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ingest-web:
    build:
      context: ../..
      dockerfile: services/ingest-web/Dockerfile
    image: stellytics-ingest-web:dev
    environment:
      # User that only reads ingest_site.
      DATABASE_URL: postgresql://stellytics_ingest:${STELLYTICS_INGEST_DB_PASSWORD:-stellytics_ingest}@postgres:5432/stellytics
      UMAMI_URL: http://umami:3000
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
      # CIDRs of the proxies whose X-Forwarded-For is trusted (Caddy, in production).
      TRUSTED_PROXIES: ${INGEST_TRUSTED_PROXIES:-}
      RATE_LIMIT: ${INGEST_RATE_LIMIT:-20}
      RATE_BURST: ${INGEST_RATE_BURST:-40}
      # Short in the local environment, so a new site takes effect quickly.
      SITE_CACHE_TTL: ${INGEST_SITE_CACHE_TTL:-5s}
      # Key for the JS execution proof challenges (#25), with 32+ characters.
      PROOF_SECRET: ${INGEST_PROOF_SECRET:-dev-only-ingest-proof-secret-change-me}
      PROOF_BITS: ${INGEST_PROOF_BITS:-12}
      # Maximum distinct fingerprints per truncated IP and site in the window (#26).
      FINGERPRINT_LIMIT: ${INGEST_FINGERPRINT_LIMIT:-50}
      FINGERPRINT_WINDOW: ${INGEST_FINGERPRINT_WINDOW:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
      # The ingest_site view comes from the migrations the portal applies on startup.
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INGEST_WEB_PORT:-3002}:8080"
    healthcheck:
      test: ["CMD", "/ingest-web", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  collector:
    build:
      context: ../..
      dockerfile: services/collector/Dockerfile
    image: stellytics-collector:dev
    environment:
      # User that only reads ingest_key_active and writes to api_metric_1m.
      DATABASE_URL: postgresql://stellytics_collector:${STELLYTICS_COLLECTOR_DB_PASSWORD:-stellytics_collector}@postgres:5432/stellytics
      # Short in the local environment, so a new or revoked key takes effect quickly.
      INGEST_KEY_CACHE_TTL: ${COLLECTOR_KEY_CACHE_TTL:-5s}
    depends_on:
      postgres:
        condition: service_healthy
      # The ingest_key_active view comes from the migrations the portal applies on startup.
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${COLLECTOR_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Rollup 1m -> 1h -> 1d and retention of the API metrics (#34).
  rollup:
    build:
      context: ../..
      dockerfile: services/rollup/Dockerfile
    image: stellytics-rollup:dev
    environment:
      # Owner of the metric tables: creates and drops partitions.
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:-stellytics}@postgres:5432/stellytics
      ROLLUP_INTERVAL: ${ROLLUP_INTERVAL:-15m}
      ROLLUP_LOOKBACK: ${ROLLUP_LOOKBACK:-48h}
      # Retention of the web events in Umami (#154): the same job deletes events and
      # sessions older than UMAMI_RETENTION_DAYS (default, about six
      # months). Without UMAMI_DATABASE_URL the pruning stays off.
      UMAMI_DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@postgres:5432/umami
      UMAMI_RETENTION_DAYS: ${UMAMI_RETENTION_DAYS:-183}
    depends_on:
      postgres:
        condition: service_healthy
      # The api_metric_* functions come from the migrations the portal applies on startup.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/rollup", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
