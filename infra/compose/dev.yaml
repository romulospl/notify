# Ambiente local: PostgreSQL (bancos umami e stellytics), Umami v3.4.1, Mailpit, o portal,
# o gateway de ingestão web, o coletor de métricas de API e o job de consolidação.
# Valores padrão são só para desenvolvimento; sobrescreva em um .env na raiz.

services:
  postgres:
    # Postgres 17.11, fixado por digest.
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      STELLYTICS_DB_PASSWORD: ${STELLYTICS_DB_PASSWORD:-stellytics}
      # Usuários do gateway e do coletor, com permissão mínima (02-ingest-roles.sh).
      STELLYTICS_INGEST_DB_PASSWORD: ${STELLYTICS_INGEST_DB_PASSWORD:-stellytics_ingest}
      STELLYTICS_COLLECTOR_DB_PASSWORD: ${STELLYTICS_COLLECTOR_DB_PASSWORD:-stellytics_collector}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda só na primeira subida (volume vazio): cria os bancos umami e stellytics
      # e os usuários stellytics_ingest e stellytics_collector.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stellytics && pg_isready -U postgres -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  umami:
    # Umami v3.4.1, fixado por tag e digest. Só suba de versão por PR (ver CLAUDE.md).
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-dev-only-umami-app-secret}
      DISABLE_TELEMETRY: "1"
      # IP do cliente, já truncado pelo gateway.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
    depends_on:
      postgres:
        condition: service_healthy
    # Sem porta publicada (#62): o Umami só é alcançável pela rede interna, pelo
    # portal e pelo gateway. Publicar o /api/send deixaria contornar o anti-bot e
    # o truncamento de IP. Para usar a interface ou a API no host durante o
    # desenvolvimento, inclua o umami-port.yaml (ver o README desta pasta).
    # Gravação de sessão e heatmaps ficam desligados: só existem com
    # recorder_enabled por site, que o portal nunca liga, e a rota /api/record
    # não é repassada pelo gateway (docs/umami.md).
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Recebe os e-mails do portal (confirmação e redefinição de senha, #60).
  # Caixa de entrada em http://127.0.0.1:8025; SMTP em 127.0.0.1:1025 para o
  # `next dev` fora do Docker. Em produção o SMTP vem da IaC (#14).
  mailpit:
    # Mailpit v1.32.0, fixado por tag e digest.
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      # Estágio com as contas de desenvolvimento (drizzle-dev).
      target: dev
    image: stellytics-portal:dev
    environment:
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:-stellytics}@postgres:5432/stellytics
      BETTER_AUTH_SECRET: ${PORTAL_AUTH_SECRET:-dev-only-portal-auth-secret-change-me}
      BETTER_AUTH_URL: http://localhost:${PORTAL_PORT:-3000}
      # Aplica as migrações do Drizzle na subida.
      RUN_MIGRATIONS: "true"
      # Contas de desenvolvimento (apps/portal/drizzle-dev). Nunca em produção.
      SEED_DEV_DATA: "true"
      # Conta de serviço no Umami (#58). A chave sai de
      # `pnpm --filter @stellytics/portal umami:service-account`; sem ela o portal
      # sobe, mas não cria sites nem lê estatísticas.
      UMAMI_URL: http://umami:3000
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      # E-mails de confirmação e de redefinição de senha vão para o Mailpit.
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: stellytics <no-reply@stellytics.localhost>
      # Cadastro com aprovação prévia (#49, ADR 0007): true deixa projetos novos
      # pendentes até um operador aprovar em /operator/approvals.
      SIGNUP_APPROVAL: ${SIGNUP_APPROVAL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/ok >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ingest-web:
    build:
      context: ../..
      dockerfile: services/ingest-web/Dockerfile
    image: stellytics-ingest-web:dev
    environment:
      # Usuário que só lê a ingest_site.
      DATABASE_URL: postgresql://stellytics_ingest:${STELLYTICS_INGEST_DB_PASSWORD:-stellytics_ingest}@postgres:5432/stellytics
      UMAMI_URL: http://umami:3000
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
      # CIDRs dos proxies cujo X-Forwarded-For vale (o Caddy, em produção).
      TRUSTED_PROXIES: ${INGEST_TRUSTED_PROXIES:-}
      RATE_LIMIT: ${INGEST_RATE_LIMIT:-20}
      RATE_BURST: ${INGEST_RATE_BURST:-40}
      # Curto no ambiente local, para um site novo valer logo.
      SITE_CACHE_TTL: ${INGEST_SITE_CACHE_TTL:-5s}
      # Chave dos desafios da prova de execução de JS (#25), com 32+ caracteres.
      PROOF_SECRET: ${INGEST_PROOF_SECRET:-dev-only-ingest-proof-secret-change-me}
      PROOF_BITS: ${INGEST_PROOF_BITS:-12}
      # Máximo de fingerprints distintas por IP truncado e site na janela (#26).
      FINGERPRINT_LIMIT: ${INGEST_FINGERPRINT_LIMIT:-50}
      FINGERPRINT_WINDOW: ${INGEST_FINGERPRINT_WINDOW:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
      # A visão ingest_site vem das migrações que o portal aplica ao subir.
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INGEST_WEB_PORT:-3002}:8080"
    healthcheck:
      test: ["CMD", "/ingest-web", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  collector:
    build:
      context: ../..
      dockerfile: services/collector/Dockerfile
    image: stellytics-collector:dev
    environment:
      # Usuário que só lê a ingest_key_active e grava em api_metric_1m.
      DATABASE_URL: postgresql://stellytics_collector:${STELLYTICS_COLLECTOR_DB_PASSWORD:-stellytics_collector}@postgres:5432/stellytics
      # Curto no ambiente local, para uma chave nova ou revogada valer logo.
      INGEST_KEY_CACHE_TTL: ${COLLECTOR_KEY_CACHE_TTL:-5s}
    depends_on:
      postgres:
        condition: service_healthy
      # A visão ingest_key_active vem das migrações que o portal aplica ao subir.
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${COLLECTOR_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Consolidação 1m -> 1h -> 1d e retenção das métricas de API (#34).
  rollup:
    build:
      context: ../..
      dockerfile: services/rollup/Dockerfile
    image: stellytics-rollup:dev
    environment:
      # Dono das tabelas de métricas: cria e apaga partições.
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:-stellytics}@postgres:5432/stellytics
      ROLLUP_INTERVAL: ${ROLLUP_INTERVAL:-15m}
      ROLLUP_LOOKBACK: ${ROLLUP_LOOKBACK:-48h}
      # Retenção dos eventos web no Umami (#154): o mesmo job apaga eventos e
      # sessões mais antigos que UMAMI_RETENTION_DAYS (padrão, cerca de seis
      # meses). Sem UMAMI_DATABASE_URL a poda fica desligada.
      UMAMI_DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@postgres:5432/umami
      UMAMI_RETENTION_DAYS: ${UMAMI_RETENTION_DAYS:-183}
    depends_on:
      postgres:
        condition: service_healthy
      # As funções api_metric_* vêm das migrações que o portal aplica ao subir.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/rollup", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
