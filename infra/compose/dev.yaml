# Ambiente local: PostgreSQL (bancos umami e notify), Umami v3.4.1 e o portal.
# Gateway e coletor entram aqui nas issues que os criam.
# Valores padrão são só para desenvolvimento; sobrescreva em um .env na raiz.

services:
  postgres:
    # Postgres 17.11, fixado por digest.
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:-notify}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda só na primeira subida (volume vazio): cria os bancos umami e notify.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notify && pg_isready -U postgres -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  umami:
    # Umami v3.4.1, fixado por tag e digest. Só suba de versão por PR (ver CLAUDE.md).
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-dev-only-umami-app-secret}
      DISABLE_TELEMETRY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    # Só no localhost. A #62 tira a porta e deixa o Umami apenas na rede interna.
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
    image: notify-portal:dev
    environment:
      DATABASE_URL: postgresql://notify:${NOTIFY_DB_PASSWORD:-notify}@postgres:5432/notify
      BETTER_AUTH_SECRET: ${PORTAL_AUTH_SECRET:-dev-only-portal-auth-secret-change-me}
      BETTER_AUTH_URL: http://localhost:${PORTAL_PORT:-3000}
      # Aplica as migrações do Drizzle na subida.
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/ok >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
