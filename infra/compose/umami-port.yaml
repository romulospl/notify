# Development only: publishes Umami on 127.0.0.1:${UMAMI_PORT:-3001},
# for the admin UI, the service account script (#58),
# `next dev` outside Docker and the gateway end-to-end test.
#
#   docker compose -f compose.yaml -f infra/compose/umami-port.yaml up -d --wait
#
# Or, in the root .env: COMPOSE_FILE=compose.yaml:infra/compose/umami-port.yaml
# Never use this file outside the development machine or CI (#62).
services:
  umami:
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
