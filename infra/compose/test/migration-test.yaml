# Only for the data migration test (test/data-migration-test.sh, #54).
# Goes on top of prod.yaml and prod-test.yaml and lets two stacks (origin and
# destination) run side by side on the same machine: removes the fixed network
# IPs (Caddy, which uses them, does not start in this test) and publishes on
# loopback only what the test reaches from outside. Never use in production.

services:
  umami:
    networks: !override [internal]
  s3:
    ports:
      - "127.0.0.1:${S3_PORT:?}:8333"
  portal:
    ports:
      - "127.0.0.1:${PORTAL_PORT:?}:3000"

networks:
  internal: !override
    driver: bridge
