# Só para o teste da pilha de produção (test/prod-stack-test.sh e o job
# `prod-stack` do CI). Acrescenta um S3 local (SeaweedFS, Apache-2.0) no lugar
# do Object Storage da Hetzner. Nunca use em produção.

services:
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=10"]
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null || wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [internal]

  postgres:
    depends_on:
      s3:
        condition: service_healthy

configs:
  s3-identities:
    content: |
      {"identities": [{"name": "walg", "credentials": [{"accessKey": "${WALG_S3_ACCESS_KEY}", "secretKey": "${WALG_S3_SECRET_KEY}"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
