# Example backend with OTLP dual-export (#35). Requires the root compose.yaml
# (collector running) and an ingest key created at /services in the portal:
#
#   STELLYTICS_INGEST_KEY=ntf_... docker compose -f compose.yaml \
#     -f infra/compose/api-example.yaml up -d --wait
#
# The app (port 4010) exports to the tenant's OTel Collector (tenant-otelcol),
# which sends the same data to its "own APM" (debug exporter, see the logs) and
# to the stellytics collector. Guide in examples/api-backend/README.md.
# Paths relative to the repository root (the compose.yaml directory).
services:
  example-api:
    build:
      context: .
      dockerfile: examples/api-backend/Dockerfile
    image: stellytics-example-api:dev
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tenant-otelcol:4318
      OTEL_SERVICE_NAME: example-api-backend
      EXPORT_INTERVAL_MS: ${EXAMPLE_API_EXPORT_INTERVAL_MS:-5000}
    depends_on:
      tenant-otelcol:
        condition: service_started
    ports:
      - "127.0.0.1:${EXAMPLE_API_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4010/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tenant-otelcol:
    # OpenTelemetry Collector core, the same version as the stellytics collector.
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      STELLYTICS_OTLP_ENDPOINT: ${STELLYTICS_OTLP_ENDPOINT:-http://collector:4318}
      STELLYTICS_INGEST_KEY: ${STELLYTICS_INGEST_KEY:?create a key at /services in the portal}
    volumes:
      - ./examples/api-backend/otelcol.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      collector:
        condition: service_healthy
    restart: unless-stopped
