# Production (ADR 0016): every service runs in Docker Compose on one VPS.
# Caddy is the only service with public ports; Postgres, Umami and rollup stay
# on the Docker network. deploy.sh builds the images and starts everything
# with `docker compose --env-file .env.production -f prod.yaml up -d`.
#
# Differences from the local environment (dev.yaml):
# - portal, gateway, collector and rollup are built from this checkout, or
#   taken from PORTAL_IMAGE, INGEST_WEB_IMAGE, COLLECTOR_IMAGE and ROLLUP_IMAGE
#   (for example the signed release images, by digest);
# - Postgres is the Debian variant with WAL-G (postgres/Dockerfile), archiving
#   WAL continuously to S3-compatible object storage, encrypted on the client;
# - Caddy terminates TLS and proxies portal, gateway and collector (OTLP/HTTP
#   and OTLP/gRPC) over the Docker network; Postgres listens only on loopback
#   for the SSH admin tunnel;
# - no Mailpit: SMTP comes from SMTP_URL;
# - every password and key is required (no default).

# Nome fixo do projeto: contêineres stellytics-<serviço>-1 e rede stellytics_internal.
name: stellytics

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    build:
      context: ./postgres
    image: stellytics-postgres-walg:17.11-walg3.0.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
      STELLYTICS_DB_PASSWORD: ${STELLYTICS_DB_PASSWORD:?}
      STELLYTICS_INGEST_DB_PASSWORD: ${STELLYTICS_INGEST_DB_PASSWORD:?}
      STELLYTICS_COLLECTOR_DB_PASSWORD: ${STELLYTICS_COLLECTOR_DB_PASSWORD:?}
      # WAL-G (ADR 0004): WAL contínuo e backups base no Object Storage,
      # cifrados no cliente antes de sair da VM.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:?}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT:?}
      AWS_REGION: ${WALG_S3_REGION:?}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY:?}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      WALG_COMPRESSION_METHOD: brotli
      # Backups base mantidos pelo stellytics-backup (um por dia).
      WALG_RETAIN_FULL: ${WALG_RETAIN_FULL:-7}
      PGHOST: /var/run/postgresql
      PGUSER: postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      # No máximo 60 s de dados fora do backup quando há pouca escrita.
      - -c
      - archive_timeout=60
    volumes:
      # Keep STELLYTICS_DATA_DIR on a disk that survives the VPS if possible.
      - ${STELLYTICS_DATA_DIR:-/srv/stellytics}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only, for the SSH admin tunnel (infra/scripts/admin-tunnel.sh).
      - "127.0.0.1:${POSTGRES_ADMIN_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && pg_isready -U postgres -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  umami:
    # Mesma imagem do ambiente local; só sobe de versão por PR (CLAUDE.md).
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      DISABLE_TELEMETRY: "1"
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
    depends_on:
      postgres:
        condition: service_healthy
    # Sem porta publicada e sem rota pública (#62, infra/README.md).
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    networks:
      internal:
        # IP fixo só para o túnel SSH de administração (infra/scripts/admin-tunnel.sh):
        # a VM alcança a rede interna sem publicar porta.
        ipv4_address: 172.30.0.20

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
    image: ${PORTAL_IMAGE:-stellytics-portal:prod}
    environment:
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:?}@postgres:5432/stellytics
      BETTER_AUTH_SECRET: ${PORTAL_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${PORTAL_HOST:?}
      RUN_MIGRATIONS: "true"
      UMAMI_URL: http://umami:3000
      # Gerada depois da primeira subida (docs/deploy.md); sem ela o portal
      # sobe, mas não cria sites.
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      SMTP_URL: ${SMTP_URL:?}
      MAIL_FROM: ${MAIL_FROM:?}
      # Cadastro com aprovação prévia (#49, ADR 0007); desligado por padrão.
      SIGNUP_APPROVAL: ${SIGNUP_APPROVAL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/ok >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  ingest-web:
    build:
      context: ../..
      dockerfile: services/ingest-web/Dockerfile
    image: ${INGEST_WEB_IMAGE:-stellytics-ingest-web:prod}
    environment:
      DATABASE_URL: postgresql://stellytics_ingest:${STELLYTICS_INGEST_DB_PASSWORD:?}@postgres:5432/stellytics
      UMAMI_URL: http://umami:3000
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
      # Só confia no Caddy, que tem IP fixo na rede Docker.
      TRUSTED_PROXIES: 172.30.0.10,fd30:6e6f:7466::10
      PROOF_SECRET: ${INGEST_PROOF_SECRET:?}
      RATE_LIMIT: ${INGEST_RATE_LIMIT:-20}
      RATE_BURST: ${INGEST_RATE_BURST:-40}
      FINGERPRINT_LIMIT: ${INGEST_FINGERPRINT_LIMIT:-50}
      # Desligados por padrão (docs/deploy.md). Não ligue o limite de repasses
      # antes de decidir o 503 sob saturação (ADR 0011).
      SITE_STALE_TTL: ${INGEST_SITE_STALE_TTL:-0}
      RELAY_MAX_INFLIGHT: ${INGEST_RELAY_MAX_INFLIGHT:-0}
      RELAY_QUEUE_WAIT: ${INGEST_RELAY_QUEUE_WAIT:-250ms}
    depends_on:
      postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
      # A visão ingest_site vem das migrações que o portal aplica ao subir.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ingest-web", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  collector:
    build:
      context: ../..
      dockerfile: services/collector/Dockerfile
    image: ${COLLECTOR_IMAGE:-stellytics-collector:prod}
    environment:
      # Usuário que só lê a ingest_key_active e grava em api_metric_1m.
      DATABASE_URL: postgresql://stellytics_collector:${STELLYTICS_COLLECTOR_DB_PASSWORD:?}@postgres:5432/stellytics
      INGEST_KEY_CACHE_TTL: ${COLLECTOR_KEY_CACHE_TTL:-60s}
    # O memory_limiter do coletor (80% do limite) só protege a VM se o
    # contêiner tiver teto: sem ele, a conta é sobre a memória da VM inteira e o
    # Postgres sofre antes de o coletor recusar dados.
    mem_limit: ${COLLECTOR_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      # A visão ingest_key_active vem das migrações que o portal aplica ao subir.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  # Consolidação 1m -> 1h -> 1d e retenção das métricas de API (#34) e dos
  # eventos web no Umami (#154).
  rollup:
    build:
      context: ../..
      dockerfile: services/rollup/Dockerfile
    image: ${ROLLUP_IMAGE:-stellytics-rollup:prod}
    environment:
      # Dono das tabelas de métricas: cria e apaga partições.
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:?}@postgres:5432/stellytics
      ROLLUP_INTERVAL: ${ROLLUP_INTERVAL:-15m}
      ROLLUP_LOOKBACK: ${ROLLUP_LOOKBACK:-48h}
      # Retenção dos eventos web no Umami (#154): o mesmo job apaga eventos e
      # sessões mais antigos que UMAMI_RETENTION_DAYS (padrão, cerca de seis
      # meses; docs/umami.md). O mesmo usuário do banco umami, dono das tabelas.
      UMAMI_DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      UMAMI_RETENTION_DAYS: ${UMAMI_RETENTION_DAYS:-183}
    depends_on:
      postgres:
        condition: service_healthy
      # As funções api_metric_* vêm das migrações que o portal aplica ao subir.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/rollup", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  caddy:
    # Caddy com TLS automático. Só ele publica portas públicas.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?}
      PORTAL_ALIAS_HOST: ${PORTAL_ALIAS_HOST:?}
      INGEST_HOST: ${INGEST_HOST:?}
      API_HOST: ${API_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy:/etc/caddy:ro
      - ${STELLYTICS_DATA_DIR:-/srv/stellytics}/caddy:/data
    depends_on:
      portal:
        condition: service_healthy
      ingest-web:
        condition: service_healthy
      collector:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      internal:
        ipv4_address: 172.30.0.10
        ipv6_address: fd30:6e6f:7466::10

# Rede isolada dos serviços internos; somente Caddy publica portas públicas.
networks:
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd30:6e6f:7466::/64
