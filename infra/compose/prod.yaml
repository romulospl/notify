# Production (ADR 0016): every service runs in Docker Compose on one VPS.
# Caddy is the only service with public ports; Postgres, Umami and rollup stay
# on the Docker network. deploy.sh builds the images and starts everything
# with `docker compose --env-file .env.production -f prod.yaml up -d`.
#
# Differences from the local environment (dev.yaml):
# - portal, gateway, collector and rollup are built from this checkout, or
#   taken from PORTAL_IMAGE, INGEST_WEB_IMAGE, COLLECTOR_IMAGE and ROLLUP_IMAGE
#   (for example the signed release images, by digest);
# - Postgres is the Debian variant with WAL-G (postgres/Dockerfile), archiving
#   WAL continuously to S3-compatible object storage, encrypted on the client,
#   when WALG_S3_* is set (without it there is no backup);
# - Caddy terminates TLS and proxies portal, gateway and collector (OTLP/HTTP
#   and OTLP/gRPC) over the Docker network; Postgres listens only on loopback
#   for the SSH admin tunnel;
# - no Mailpit: SMTP, when set, comes from SMTP_URL;
# - every password and key is required (no default).

# Fixed project name: containers stellytics-<service>-1 and network stellytics_internal.
name: stellytics

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    build:
      context: ./postgres
    image: stellytics-postgres-walg:17.11-walg3.0.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
      STELLYTICS_DB_PASSWORD: ${STELLYTICS_DB_PASSWORD:?}
      STELLYTICS_INGEST_DB_PASSWORD: ${STELLYTICS_INGEST_DB_PASSWORD:?}
      STELLYTICS_COLLECTOR_DB_PASSWORD: ${STELLYTICS_COLLECTOR_DB_PASSWORD:?}
      # WAL-G (ADR 0004): continuous WAL and base backups in Object Storage,
      # encrypted on the client before leaving the VM. Optional: with
      # WALG_S3_PREFIX empty there is no backup (deploy.sh warns).
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT:-}
      AWS_REGION: ${WALG_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY:-}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:-}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      WALG_COMPRESSION_METHOD: brotli
      # Base backups kept by stellytics-backup (one per day).
      WALG_RETAIN_FULL: ${WALG_RETAIN_FULL:-7}
      PGHOST: /var/run/postgresql
      PGUSER: postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Without a bucket the segment is dropped instead of piling up in pg_wal.
      - -c
      - archive_command=test -z "$$WALG_S3_PREFIX" || wal-g wal-push %p
      # At most 60 s of data outside the backup when there is little writing.
      - -c
      - archive_timeout=60
    volumes:
      # Keep STELLYTICS_DATA_DIR on a disk that survives the VPS if possible.
      - ${STELLYTICS_DATA_DIR:-/srv/stellytics}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only, for the SSH admin tunnel (infra/scripts/admin-tunnel.sh).
      - "127.0.0.1:${POSTGRES_ADMIN_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      # Over TCP: during the init scripts the entrypoint's temporary server
      # listens only on the socket, so this passes only after they finish.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  umami:
    # Same image as the local environment; upgraded only by PR (CLAUDE.md).
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      DISABLE_TELEMETRY: "1"
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
    depends_on:
      postgres:
        condition: service_healthy
    # No published port and no public route (#62, infra/README.md).
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    networks:
      internal:
        # Fixed IP only for the SSH admin tunnel (infra/scripts/admin-tunnel.sh):
        # the VM reaches the internal network without publishing a port.
        ipv4_address: 172.30.0.20

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
    image: ${PORTAL_IMAGE:-stellytics-portal:prod}
    environment:
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:?}@postgres:5432/stellytics
      BETTER_AUTH_SECRET: ${PORTAL_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${PORTAL_HOST:?}
      RUN_MIGRATIONS: "true"
      UMAMI_URL: http://umami:3000
      # Generated after the first start (docs/deploy.md); without it the portal
      # starts, but creates no sites.
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      # Optional: the public portal sends no email in this version (no
      # sign-up, operator invites disabled).
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Sign-up with prior approval (#49, ADR 0007); off by default.
      SIGNUP_APPROVAL: ${SIGNUP_APPROVAL:-false}
      # Public demo: slug of the one tenant shown without sign-in at
      # /demo and /operator. Empty: sample data.
      DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-}
      # Gateway address in the installation tag shown on each site's page.
      INGEST_URL: https://${INGEST_HOST:?}
      # Collector OTLP address shown with each service's ingest keys.
      COLLECTOR_URL: https://${API_HOST:?}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  ingest-web:
    build:
      context: ../..
      dockerfile: services/ingest-web/Dockerfile
    image: ${INGEST_WEB_IMAGE:-stellytics-ingest-web:prod}
    environment:
      DATABASE_URL: postgresql://stellytics_ingest:${STELLYTICS_INGEST_DB_PASSWORD:?}@postgres:5432/stellytics
      UMAMI_URL: http://umami:3000
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
      # Trusts only Caddy, which has a fixed IP on the Docker network.
      TRUSTED_PROXIES: 172.30.0.10,fd30:6e6f:7466::10
      PROOF_SECRET: ${INGEST_PROOF_SECRET:?}
      RATE_LIMIT: ${INGEST_RATE_LIMIT:-20}
      RATE_BURST: ${INGEST_RATE_BURST:-40}
      FINGERPRINT_LIMIT: ${INGEST_FINGERPRINT_LIMIT:-50}
      # Off by default (docs/deploy.md). Do not turn on the relay limit
      # before deciding on the 503 under saturation (ADR 0011).
      SITE_STALE_TTL: ${INGEST_SITE_STALE_TTL:-0}
      RELAY_MAX_INFLIGHT: ${INGEST_RELAY_MAX_INFLIGHT:-0}
      RELAY_QUEUE_WAIT: ${INGEST_RELAY_QUEUE_WAIT:-250ms}
    depends_on:
      postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
      # The ingest_site view comes from the migrations the portal applies on startup.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ingest-web", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  collector:
    build:
      context: ../..
      dockerfile: services/collector/Dockerfile
    image: ${COLLECTOR_IMAGE:-stellytics-collector:prod}
    environment:
      # User that only reads ingest_key_active and writes to api_metric_1m.
      DATABASE_URL: postgresql://stellytics_collector:${STELLYTICS_COLLECTOR_DB_PASSWORD:?}@postgres:5432/stellytics
      INGEST_KEY_CACHE_TTL: ${COLLECTOR_KEY_CACHE_TTL:-60s}
    # The collector's memory_limiter (80% of the limit) only protects the VM if the
    # container has a ceiling: without it, the figure is taken over the whole VM's memory and
    # Postgres suffers before the collector refuses data.
    mem_limit: ${COLLECTOR_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      # The ingest_key_active view comes from the migrations the portal applies on startup.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  # Rollup 1m -> 1h -> 1d and retention of the API metrics (#34) and of the
  # web events in Umami (#154).
  rollup:
    build:
      context: ../..
      dockerfile: services/rollup/Dockerfile
    image: ${ROLLUP_IMAGE:-stellytics-rollup:prod}
    environment:
      # Owner of the metric tables: creates and drops partitions.
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:?}@postgres:5432/stellytics
      ROLLUP_INTERVAL: ${ROLLUP_INTERVAL:-15m}
      ROLLUP_LOOKBACK: ${ROLLUP_LOOKBACK:-48h}
      # Retention of the web events in Umami (#154): the same job deletes events and
      # sessions older than UMAMI_RETENTION_DAYS (default, about six
      # months; docs/umami.md). The same user of the umami database, owner of the tables.
      UMAMI_DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      UMAMI_RETENTION_DAYS: ${UMAMI_RETENTION_DAYS:-183}
    depends_on:
      postgres:
        condition: service_healthy
      # The api_metric_* functions come from the migrations the portal applies on startup.
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/rollup", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  caddy:
    # Caddy with automatic TLS. Only it publishes public ports.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?}
      PORTAL_ALIAS_HOST: ${PORTAL_ALIAS_HOST:?}
      INGEST_HOST: ${INGEST_HOST:?}
      API_HOST: ${API_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy:/etc/caddy:ro
      - ${STELLYTICS_DATA_DIR:-/srv/stellytics}/caddy:/data
      # Result of the stack check (stellytics-check), served at /healthz/stack.
      - ${STELLYTICS_DATA_DIR:-/srv/stellytics}/status:/srv/status:ro
    depends_on:
      portal:
        condition: service_healthy
      ingest-web:
        condition: service_healthy
      collector:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      internal:
        ipv4_address: 172.30.0.10
        ipv6_address: fd30:6e6f:7466::10

# Isolated network for the internal services; only Caddy publishes public ports.
networks:
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd30:6e6f:7466::/64
