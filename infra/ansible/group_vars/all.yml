# Valores não secretos do deploy (#14). Os segredos ficam em secrets.yml (fora
# do git; modelo em secrets.example.yml).

# Onde a aplicação e os dados ficam na VM.
notify_root: /opt/notify
notify_data_dir: /srv/notify

# Hosts públicos (registros A e AAAA apontando para a VM). O da ingestão não
# pode ter umami, analytics, track nem collect (CLAUDE.md).
portal_host: app.example.org
ingest_host: e.example.org
acme_email: ops@example.org
mail_from: "notify <no-reply@example.org>"

# Imagens publicadas pelo workflow de release, SEMPRE por digest. O deploy
# confere a assinatura de cada uma com cosign antes de subir.
portal_image: ghcr.io/romulospl/notify/portal@sha256:CONFIRA
ingest_web_image: ghcr.io/romulospl/notify/ingest-web@sha256:CONFIRA
cosign_identity_regexp: '^https://github.com/romulospl/notify/\.github/workflows/release\.yml@refs/tags/v'
cosign_oidc_issuer: https://token.actions.githubusercontent.com

# cosign 3.1.4, fixado por hash (https://github.com/sigstore/cosign/releases).
cosign_version: v3.1.4
cosign_sha256:
  amd64: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  arm64: ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2

# Object Storage do backup (saídas do OpenTofu).
walg_s3_endpoint: https://nbg1.your-objectstorage.com
walg_s3_region: nbg1
walg_s3_prefix: s3://CONFIRA/postgres
# Backups base mantidos (um por dia).
walg_retain_full: 7
# Horário do backup base diário (systemd OnCalendar, em UTC).
backup_on_calendar: "*-*-* 03:15:00 UTC"

# Monitoramento externo (#15, ADR 0005), na VM `monitor`.
monitor_root: /opt/notify-monitor
# Para onde vão os alertas e por qual SMTP (a senha fica em secrets.yml).
monitor_alert_email: ops@example.org
monitor_smtp_smarthost: smtp.example.org:587
monitor_smtp_from: "notify monitor <monitor@example.org>"
monitor_smtp_username: ""
monitor_smtp_require_tls: true
# URL OTLP da ingestão de API, quando o coletor (#30) estiver publicado na
# produção. Vazia, a ingestão de API não é testada.
monitor_api_url: ""
