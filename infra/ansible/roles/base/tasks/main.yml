# Sistema: atualizações automáticas de segurança, UTC e SSH só por chave.
- name: Instala pacotes básicos
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, unattended-upgrades, apt-listchanges]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Liga as atualizações automáticas de segurança
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Fuso horário UTC (as datas do portal e dos backups são em UTC)
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    state: link
    force: true

- name: SSH só por chave
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-notify.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reinicia o SSH
