# Deploy da produção (#14, ADR 0004). Uso, de infra/ansible:
#   ansible-playbook site.yml -e @secrets.yml
# Inventário em inventory/production.yml (fora do git; copie do .example).
[defaults]
inventory = inventory/production.yml
remote_user = root
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
# Nada de segredo no log: as tarefas com segredo usam no_log.
display_skipped_hosts = False

[ssh_connection]
pipelining = True
