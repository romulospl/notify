AWSTemplateFormatVersion: '2010-09-09'
Description: Recovery and daily backups for the existing Stellytics Docker host
Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
  OperationsEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 35
    Description: Days to keep each daily recovery point (see docs/privacidade.md)
Resources:
  Operations:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref OperationsEmail
  # Physical host failure: move the instance to healthy hardware.
  SystemFailure:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the EC2 host after two failed system checks
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Sub arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover
        - !Ref Operations
      OKActions:
        - !Ref Operations
  # Guest failure (kernel, disk full, memory): the recover action does not
  # cover it, so reboot and warn.
  InstanceFailure:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reboot the EC2 instance after three failed instance checks
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Sub arn:${AWS::Partition}:automate:${AWS::Region}:ec2:reboot
        - !Ref Operations
      OKActions:
        - !Ref Operations
  BackupKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Stellytics EC2 backup vault key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
  Vault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub '${AWS::StackName}-ec2'
      EncryptionKeyArn: !GetAtt BackupKey.Arn
      AccessPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: backup:DeleteRecoveryPoint
            Resource: '*'
            Condition:
              StringNotLike:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Ref AWS::StackName
        BackupPlanRule:
          - RuleName: daily
            TargetBackupVault: !Ref Vault
            # After infra/aws/pg-dump.sh (02:30 UTC).
            ScheduleExpression: cron(0 3 * * ? *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 240
            Lifecycle:
              DeleteAfterDays: !Ref RetentionDays
  Selection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: stellytics-host
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
  BackupFailed:
    Type: AWS::Events::Rule
    Properties:
      Description: Warn when a Stellytics backup job does not complete
      EventPattern:
        source: [aws.backup]
        detail-type: [Backup Job State Change]
        detail:
          backupVaultName: [!Ref Vault]
          state: [FAILED, ABORTED, EXPIRED]
      Targets:
        - Arn: !Ref Operations
          Id: operations
  BackupEventsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref Operations
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref Operations
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
Outputs:
  BackupVaultName:
    Value: !Ref Vault
  OperationsTopic:
    Value: !Ref Operations
