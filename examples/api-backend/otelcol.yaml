# The tenant's OTel Collector doing dual-export (#35): receives the app's OTLP
# and sends the same data to the tenant's own backend and to the stellytics collector.
#
# Variables: STELLYTICS_OTLP_ENDPOINT (e.g. https://otlp.<stellytics-domain>) and
# STELLYTICS_INGEST_KEY (ntf_..., created in /services in the portal).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Stands in for the tenant's APM (Jaeger, Tempo, Prometheus, a SaaS...).
  debug:
    verbosity: basic
  # stellytics collector.
  otlp_http/stellytics:
    endpoint: ${env:STELLYTICS_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:STELLYTICS_INGEST_KEY}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/stellytics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/stellytics]
