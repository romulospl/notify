# OCB (OpenTelemetry Collector Builder) manifest of the collector distribution.
# Generates collector/cmd/stellytics-collector inside the services/ module (a
# single Go module, ADR 0002). To regenerate, from inside services/:
#   collector/generate.sh
# Collector core versions at least 14 days old, like the other dependencies.
dist:
  name: stellytics-collector
  description: stellytics API metrics collector
  output_path: ./collector/cmd/stellytics-collector
  version: 0.1.0

extensions:
  - gomod: github.com/romulospl/stellytics/services v0.0.0
    import: github.com/romulospl/stellytics/services/collector/components/ingestkeyauth
    name: ingestkeyauth

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: github.com/romulospl/stellytics/services v0.0.0
    import: github.com/romulospl/stellytics/services/collector/components/tenantattr
    name: tenantattr

exporters:
  # Counters and histograms to Postgres (#31).
  - gomod: github.com/romulospl/stellytics/services v0.0.0
    import: github.com/romulospl/stellytics/services/collector/components/pgexporter
    name: pgexporter
  # Logs are dropped (E5 spec, section 2).
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.164.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
