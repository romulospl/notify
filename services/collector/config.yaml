# Collector configuration (E5 spec). The values come from the environment.
#
# Every OTLP request, over gRPC (4317) or HTTP (4318), goes through the
# ingestkeyauth extension: without a valid ingest key, 401 / Unauthenticated.
# The tenantattr processor stamps the key's tenant and service on each resource
# and must come before batch, which loses the request context. The
# stellyticspg exporter (#31) turns HTTP server spans and the
# http.server.request.duration histogram into 1-minute points in
# api_metric_1m; the rest of the traces and metrics, and all logs, are dropped.
extensions:
  ingestkeyauth:
    database_url: ${env:DATABASE_URL}
    cache_ttl: ${env:INGEST_KEY_CACHE_TTL:-60s}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: ingestkeyauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: ingestkeyauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  tenantattr: {}
  batch: {}

exporters:
  stellyticspg:
    database_url: ${env:DATABASE_URL}
  nop: {}

service:
  extensions: [ingestkeyauth]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tenantattr, batch]
      exporters: [stellyticspg]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, tenantattr, batch]
      exporters: [stellyticspg]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, tenantattr, batch]
      exporters: [nop]
