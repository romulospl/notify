# CI: lint, typecheck, testes e build em todo push na main e em todo PR.
# Actions fixadas por SHA (comentário com a tag), conforme o ADR 0002.
# O job "ci" agrega os demais; é o check a exigir se a main ganhar proteção de branch.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notify -d notify"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://notify:notify@localhost:5432/notify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Falha se o pnpm-lock.yaml estiver ausente ou desatualizado.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notify -d notify"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://notify:notify@localhost:5432/notify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.*
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: |
          go mod tidy -diff
      - name: go vet e go test
        run: |
          # go vet/test falham quando o módulo ainda não tem pacotes.
          if [ -z "$(go list ./... 2>/dev/null)" ]; then echo "Nenhum pacote Go ainda."; exit 0; fi
          go vet ./...
          go test -race ./...

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sobe o ambiente local
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Confere bancos, Umami e portal
        run: |
          docker compose exec -T postgres psql -U postgres -Atc \
            "select count(*) from pg_database where datname in ('umami','notify')" | grep -qx 2
          curl -fsS http://127.0.0.1:3001/api/heartbeat
          curl -fsS http://127.0.0.1:3000/api/auth/ok
          # Rota privada sem sessão redireciona para o login.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard)" = 307
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  ci:
    name: ci
    if: always()
    needs: [node, go, compose]
    runs-on: ubuntu-24.04
    steps:
      - name: Todos os jobs passaram
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
