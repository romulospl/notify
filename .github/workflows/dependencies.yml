# Dependency scan: vulnerabilities (Go and pnpm) and licenses.
# Stays out of the ci workflow for the same reason as adblock: the result
# changes without a code change (a new advisory turns red a PR that touches
# nothing). Runs on PRs that touch manifests, lockfiles or the Go version of the
# images, on main and once a day, to catch an advisory published later.
# How to handle an alert: CONTRIBUTING.md, Dependencies section.
name: dependencies

on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - services/go.mod
      - services/go.sum
      - services/*/Dockerfile
      - scripts/deps/**
      - scripts/licenses/**
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - services/go.mod
      - services/go.sum
      - services/*/Dockerfile
      - scripts/deps/**
      - scripts/licenses/**
      - .github/workflows/dependencies.yml
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reachable vulnerabilities (govulncheck only fails when the code calls the
  # vulnerable symbol). Runs with the Go of the images (FROM golang:X.Y.Z in the
  # Dockerfiles), because its standard library is what goes to production. Turns
  # red when the image uses a Go with an already fixed vulnerability, until the
  # Dockerfiles are bumped; that is expected and short. (The licenses job uses
  # go-version-file: the license does not depend on the Go version, only on the
  # go.mod dependencies.)
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version of the images
        id: gover
        run: |
          versions=$(sed -nE 's/^FROM golang:([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/p' services/*/Dockerfile | sort -u)
          echo "Versions in the Dockerfiles: $versions"
          if [ "$(echo "$versions" | wc -l)" -ne 1 ] || [ -z "$versions" ]; then
            echo "::error::The Dockerfiles in services/ must use the same Go version (and have one)."
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache: false
      # golang.org/x/vuln, BSD-3-Clause license. Exact version, more than 14 days old.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck
        working-directory: services
        run: |
          go version
          # Exits with 3 if the code calls a vulnerability; a network error while
          # fetching the vulnerability database exits with another code and
          # also turns the job red.
          govulncheck ./...

  # pnpm audit queries the registry's advisories endpoint. The script separates
  # "high/critical vulnerability" (1) from "could not query" (2); both turn
  # the job red, but the message says which one it was.
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/deps/*.test.mjs
      - run: node scripts/deps/audit-pnpm.mjs

  # Allowlist of OSI licenses in scripts/licenses/allowed.json, checked against
  # the pnpm and Go production dependencies.
  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.*
      - run: node --test scripts/deps/*.test.mjs
      # "pnpm licenses" reads what is installed in node_modules.
      - run: pnpm install --frozen-lockfile
      - name: pnpm licenses (production)
        run: pnpm licenses list --json --prod > "$RUNNER_TEMP/npm-licenses.json"
      # google/go-licenses, Apache-2.0. Exact version, more than 14 days old.
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Go licenses (packages that go into the binaries)
        working-directory: services
        run: |
          go-licenses report ./... \
            --template "$GITHUB_WORKSPACE/scripts/licenses/go-licenses.tpl" \
            --ignore github.com/romulospl/stellytics/services \
            > "$RUNNER_TEMP/go-licenses.tsv"
      - name: Check against the allowlist
        run: |
          node scripts/deps/check-licenses.mjs \
            --npm "$RUNNER_TEMP/npm-licenses.json" \
            --go "$RUNNER_TEMP/go-licenses.tsv"
