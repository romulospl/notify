# Release: roda quando uma release é publicada no GitHub (tag vX.Y.Z).
# - Anexa à release um SBOM (SPDX) do repositório, gerado com syft.
# - Para cada Dockerfile em apps/* e services/*, publica a imagem no GHCR,
#   assina com cosign (keyless, OIDC do GitHub) e anexa o SBOM da imagem como atestado.
# Actions fixadas por SHA (comentário com a tag), conforme o ADR 0002.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # anexar o SBOM à release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: notify-${{ github.event.release.tag_name }}.spdx.json
          output-file: notify-${{ github.event.release.tag_name }}.spdx.json
          upload-release-assets: true

  discover:
    name: discover images
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        name: Lista os Dockerfiles
        run: |
          images=$(find apps services -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null \
            | sort | jq -R -s -c 'split("\n") | map(select(. != "")) | map({context: ., name: (split("/") | last)})')
          echo "images=${images:-[]}" >> "$GITHUB_OUTPUT"
          echo "Imagens: ${images:-[]}"

  image:
    name: image (${{ matrix.image.name }})
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publicar no GHCR
      id-token: write # assinatura keyless do cosign
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Assina a imagem e anexa o SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
