name: Project (tenant) question
description: Question about sign-up, installing the script, OpenTelemetry dual-export or reading the dashboards.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        This is the public support channel. Do not paste ingest keys, passwords or personal data.
  - type: dropdown
    id: subject
    attributes:
      label: Subject
      options:
        - Sign-up and portal access
        - Installing the script on the site
        - Sending API metrics (OTLP dual-export)
        - Interpreting the metrics
        - Other
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
      description: Name of the project in stellytics (optional).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to do, what you have already tried and where you got stuck.
    validations:
      required: true
