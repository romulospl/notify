name: Bug
description: Something does not work as it should in the platform, the script or API ingestion.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security flaws do not go here**: use the private reporting described in `SECURITY.md`.
        Do not paste ingest keys, passwords or personal data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Portal (sign-up, login, dashboards)
        - Web tracking script
        - API ingestion (OpenTelemetry)
        - Documentation
        - I don't know
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior, with error messages if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version of the script (`/s/vX.Y.Z/`), OpenTelemetry SDK, browser or commit, as applicable.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Site framework (HTML, SPA, SSR), API language, screenshots.
